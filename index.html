:root[data-theme="dark"]{

  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}

.jp{font-family:var(--f-jp)}

.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 16px;font-weight:600;min-height:44px}

.btn.block{width:100%}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs nav{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 8px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}

.sync{font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.on i{background:var(--ok)} .sync.warn i{background:var(--warn)}
/* home */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bigbtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border-radius:16px;padding:16px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);min-height:118px}

.bigbtn .n{font-size:38px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bigbtn.rev{background:var(--ai);border-color:var(--ai);color:var(--ai-ink)}
.bigbtn.rev .muted{color:inherit;opacity:.8}
.bigbtn:disabled{opacity:.55}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:4px}
.stat b{display:block;font-size:22px;line-height:1.2;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat .label{white-space:nowrap}
.lvrow{display:grid;grid-template-columns:96px 1fr 76px;white-space:nowrap;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--line);overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .m{background:var(--ok)} .bar .l{background:var(--ai)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:110px}
.fc div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.fc span.b{width:100%;max-width:30px;background:var(--ai-soft);border:1px solid var(--ai);border-radius:5px 5px 2px 2px;min-height:2px}
.fc b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums}
/* study overlay */
.study{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.study[hidden]{display:none!important}
.stop{max-width:640px;width:100%;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.prog{flex:1;height:8px;background:var(--line);border-radius:5px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--ok);transition:width .25s}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.sinner{max-width:640px;margin:0 auto;padding-block:8px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.qtag{align-self:center;font-size:12px;font-weight:700;letter-spacing:.06em;padding:4px 10px;border-radius:999px;background:var(--ai-soft);color:var(--ai)}
.qtag.new{background:var(--warn-soft);color:var(--warn)}
.prompt{text-align:center;padding:18px 8px 10px}
.prompt .big{font-family:var(--f-jp-show);font-size:clamp(46px,13vw,72px);line-height:1.15;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.prompt .kbig{font-size:clamp(90px,28vw,132px)}
.prompt .vn{font-size:22px;font-weight:600}
.prompt .ask{margin-top:10px;color:var(--muted);font-size:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;padding:13px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-height:52px;font-size:16px}
.opt .k{flex:none;width:24px;height:24px;border-radius:7px;border:1px solid var(--line);display:grid;place-items:center;font-size:12px;color:var(--muted)}
.opt.jpopt{font-family:var(--f-jp);font-size:20px}
.opt:hover:not(:disabled){border-color:var(--ai)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.tin{width:100%;font-family:var(--f-jp);font-size:24px;text-align:center;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.tin.right{border-color:var(--ok);background:var(--ok-soft)} .tin.wrong{border-color:var(--bad);background:var(--bad-soft)}
.verdict{border-radius:12px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.sfoot{border-top:1px solid var(--line);background:var(--card)}

.grade{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}

.res{display:flex;flex-direction:column;align-items:center;gap:6px;padding:20px 0}

<script>
"use strict";
/* ================= DATA ================= */
const RAW = JSON.parse(document.getElementById('data').textContent);
const ITEMS = [];
RAW.K.forEach(k => ITEMS.push({id:'k'+k[0], kind:'k', c:k[0], hv:k[1], vn:k[2], on:k[3], kun:k[4], st:k[5], lv:k[6]}));
RAW.V.forEach((v,i) => ITEMS.push({id:'v'+i, kind:'v', w:v[0].replace(/\s*\(かん\)/,''), r:v[1].replace(/\s*\(かん\)/,''), hv:v[2], vn:v[3], lv:v[4]}));
const BYID = new Map(ITEMS.map(x => [x.id, x]));
const KMAP = new Map(ITEMS.filter(x => x.kind==='k').map(x => [x.c, x]));
const isKanji = ch => ch >= '一' && ch <= '鿿';
const kanjiOf = s => [...new Set([...s].filter(isKanji))];
function kinfo(ch){ const k = KMAP.get(ch); if (k) return {hv:k.hv, vn:k.vn}; const x = RAW.X[ch]; if (!x) return null; const [hv,vn] = x.split('|'); return {hv, vn}; }
const VOCAB = ITEMS.filter(x => x.kind==='v');
const WORDS_BY_KANJI = new Map();
VOCAB.forEach(v => kanjiOf(v.w).forEach(c => { if (!WORDS_BY_KANJI.has(c)) WORDS_BY_KANJI.set(c, []); WORDS_BY_KANJI.get(c).push(v); }));
WORDS_BY_KANJI.forEach(a => a.sort((x,y) => (y.lv-x.lv) || (x.w.length-y.w.length)));
const label = it => it.kind==='k' ? it.c : it.w;
const readingAlts = r => r.split(/[;；]/).map(s => s.replace(/\(.*?\)|（.*?）/g,'').replace(/[～〜~\s]/g,'').trim()).filter(Boolean);
const cleanReading = r => r.replace(/\s*\((する|な|の)\)/g,'').trim();

/* Thứ tự học mới: trong mỗi cấp, chữ Hán trước rồi các từ dùng chữ đó (kiểu WaniKani). */
function buildOrder(){
  const order = [];
  for (const lv of [5,4,3]){
    const ks = ITEMS.filter(x => x.kind==='k' && x.lv===lv);
    const rank = new Map(); ITEMS.filter(x => x.kind==='k' && x.lv>lv).forEach(k => rank.set(k.c, -1));
    ks.forEach((k,i) => rank.set(k.c, i));
    const vs = VOCAB.filter(v => v.lv===lv).map((v,i,a) => {
      const cs = kanjiOf(v.w); let r;
      if (!cs.length) r = i / a.length * ks.length;
      else r = Math.max(...cs.map(c => rank.has(c) ? rank.get(c) : ks.length * 0.6));
      return {v, r};
    }).sort((a,b) => a.r - b.r);
    let j = 0;
    ks.forEach((k,i) => { while (j < vs.length && vs[j].r < i) order.push(vs[j++].v); order.push(k); });
    while (j < vs.length) order.push(vs[j++].v);
  }
  return order;
}
const ORDER = buildOrder();
const ORDER_IDX = new Map(ORDER.map((x,i) => [x.id, i]));

/* ================= FSRS-4.5 ================= */
const W = [0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const DECAY = -0.5, FACTOR = 19/81;
const clampD = d => Math.min(10, Math.max(1, d));
const retr = (t, s) => Math.pow(1 + FACTOR * t / s, DECAY);
const ivlFor = (s, r) => s / FACTOR * (Math.pow(r, 1/DECAY) - 1);
const initD = g => clampD(W[4] - (g-3) * W[5]);
function fsrsNext(st, g, nowMs, retention){
  // st: null (new) or {s,d,last}; g: 1 Again,2 Hard,3 Good,4 Easy -> {s,d}
  if (!st) return {s: W[g-1], d: initD(g)};
  const t = Math.max(0, (nowMs - st.last) / 864e5);
  const R = retr(t, st.s);
  let d = st.d - W[6] * (g-3); d = clampD(W[7] * initD(3) + (1-W[7]) * d);
  let s;
  if (g === 1){
    s = W[11] * Math.pow(st.d, -W[12]) * (Math.pow(st.s+1, W[13]) - 1) * Math.exp(W[14] * (1-R));
    s = Math.min(s, st.s);
  } else {
    s = st.s * (Math.exp(W[8]) * (11 - st.d) * Math.pow(st.s, -W[9]) * (Math.exp(W[10] * (1-R)) - 1) * (g===2 ? W[15] : 1) * (g===4 ? W[16] : 1) + 1);
  }
  return {s: Math.max(0.1, s), d};
}
/* p = [dueMin, S, D, reps, lapses, lastMin] */
function schedule(p, g, nowMs){
  const st = p ? {s:p[1], d:p[2], last:p[5]*60000} : null;
  const n = fsrsNext(st, g, nowMs, SET.retention);
  let days = ivlFor(n.s, SET.retention);
  if (!p) days = g===4 ? Math.max(4, days) : 1;           // từ mới: gặp lại sau 1 ngày (Dễ: >= 4 ngày)
  else if (g === 1) days = Math.min(1, days);               // quên: ôn lại ngày mai
  days = Math.min(365, Math.max(1, Math.round(days * (0.95 + Math.random()*0.1))));
  const due = dayStartMs(nowMs + days * 864e5) + DAY_CUT*3600e3 + 60000; // đến hạn từ đầu ngày học đó (4:01 sáng)
  return [Math.floor(due/60000), +n.s.toFixed(2), +n.d.toFixed(2), (p?p[3]:0)+1, (p?p[4]:0)+(g===1&&p?1:0), Math.floor(nowMs/60000)];
}

const DAY_CUT = 4; // ngày học bắt đầu lúc 4 giờ sáng
function dayStartMs(ms){ const d = new Date(ms - DAY_CUT*3600e3); d.setHours(0,0,0,0); return d.getTime(); }
function dayKey(ms){ const d = new Date(ms - DAY_CUT*3600e3); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
const endOfTodayMs = () => dayStartMs(Date.now()) + (24+DAY_CUT)*3600e3;

let DB = null, UID = null, syncState = 'local', flushTimer = null, writing = false;

function renderSyncBadge(el){

function markDirty(doc){ dirty.add(doc); lsSave(); scheduleFlush(); }
function scheduleFlush(ms=2500){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, ms); }
function docBody(name){
  if (name==='settings') return {v:1, set:SET};
  if (name==='log') { const keys = Object.keys(LOG).sort().slice(-400); const o = {}; keys.forEach(k => o[k]=LOG[k]); return {v:1, log:o}; }
  const lv = +name[2], kind = name[3], o = {};

async function flush(){
  if (!DB || !UID || writing || !dirty.size) return;
  writing = true; setSync('saving');
  try {
    for (const name of [...dirty]){
      dirty.delete(name);
      await DB.doc('data/users/'+UID+'/'+name).set(docBody(name));
    }
    setSync('on');
  } catch(e){ setSync('err'); }
  writing = false;
  if (dirty.size) scheduleFlush(4000);
}

function mergeRemote(name, data){
  if (!data) return false;
  let changed = false;
  if (name==='settings'){
    if (data.set && JSON.stringify(data.set)!==JSON.stringify(SET)){
      if ((data.set.epoch||0) > (SET.epoch||0)){ PROG = {}; LOG = {}; }   // thiết bị khác đã xóa tiến độ
      SET = Object.assign(structuredClone(DEFAULT_SET), data.set); changed = true; applyTheme();
    }
    return changed;
  }
  if (name==='log'){ for (const k in (data.log||{})){ const a = LOG[k], b = data.log[k]; if (!a || (b.r+b.n) > (a.r+a.n)) { LOG[k] = b; changed = true; } } return changed; }
  const lv = +name[2], kind = name[3];
  let localNewer = false;
  for (const key in (data.p||{})){
    const id = kind==='k' ? 'k'+key : 'v'+key; const rp = data.p[key], lp = PROG[id];
    if (!lp || rp[5] > lp[5]) { PROG[id] = rp; changed = true; }
    else if (lp[5] > rp[5]) localNewer = true;
  }
  for (const id in PROG){ const it = BYID.get(id); if (it.lv===lv && it.kind===kind && !(keyIn(it) in (data.p||{}))) localNewer = true; }
  if (localNewer) dirty.add(name);
  return changed;
}
async function connect(){
  if (!window.claude || !window.claude.use) return;
  setSync('connecting');
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user){ setSync('local'); return; }
    const uid = await user.id();
    if (!uid){ setSync('local'); return; }
    DB = db; UID = uid;
    const names = ['settings','log', ...DOCS];
    const timer = setTimeout(() => { if (syncState==='connecting') setSync('err'); }, 10000);
    let firstDone = 0;
    names.forEach(name => {
      DB.doc('data/users/'+UID+'/'+name).onSnapshot(snap => {
        if (snap.metadata.hasPendingWrites) return;
        const changed = snap.exists ? mergeRemote(name, snap.data()) : (dirtyIfLocal(name), false);
        if (!snap.metadata.fromCache && ++firstDone === names.length){ clearTimeout(timer); setSync('on'); scheduleFlush(500); }
        if (changed){ lsSave(); if (!SESSION) render(); }
      }, () => setSync('err'));
    });
  } catch(e){ setSync('local'); }
}
function dirtyIfLocal(name){
  if (name==='settings' || name==='log'){ dirty.add(name); return; }
  const lv = +name[2], kind = name[3];
  for (const id in PROG){ const it = BYID.get(id); if (it.lv===lv && it.kind===kind){ dirty.add(name); return; } }
}

const shuffle = a => { for (let i=a.length-1;i>0;i--){ const j = Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pick = (a,n) => shuffle(a.slice()).slice(0,n);
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2200); }
function today(){ const k = dayKey(Date.now()); return LOG[k] || (LOG[k] = {r:0,n:0,ok:0,t:0}); }
function enabled(it){ return SET.levels[it.lv] && SET.kinds[it.kind]; }
function status(it){
  const p = PROG[it.id];

function dueItems(){ const end = endOfTodayMs(); return ITEMS.filter(it => enabled(it) && PROG[it.id] && PROG[it.id][0]*60000 < end).sort((a,b) => PROG[a.id][0]-PROG[b.id][0]); }
function dueNowCount(){ return Math.min(dueItems().length, Math.max(0, SET.maxReviews - today().r)); }
function newLeft(){ return Math.max(0, SET.newPerDay - today().n); }
function newQueue(n){ const out = []; for (const it of ORDER){ if (out.length>=n) break; if (enabled(it) && !PROG[it.id]) out.push(it); } return out; }
function streak(){
  let s = 0, d = Date.now();
  if (!LOG[dayKey(d)] || !(LOG[dayKey(d)].r + LOG[dayKey(d)].n)) d -= 864e5;
  while (true){ const l = LOG[dayKey(d)]; if (l && (l.r+l.n) > 0){ s++; d -= 864e5; } else break; }
  return s;
}

function qTypes(it){
  if (it.kind==='k'){ const t = ['k-hv']; if (SET.reverse) t.push('k-rev'); if (it.on) t.push('k-on'); return t; }
  const hasK = kanjiOf(it.w).length > 0, t = ['v-mean'];
  if (hasK) t.push('v-read');
  if (SET.reverse) t.push('v-rev');
  return t;
}
/* Xoay vòng kiểu câu hỏi theo số lần ôn; cách đọc (漢字読み) xuất hiện nhiều nhất vì là phần hay ra đề JLPT. */
const V_CYCLE = ['v-mean','v-read','v-read','v-rev','v-read','v-mean'];
const K_CYCLE = ['k-hv','k-on','k-rev','k-hv','k-on'];
function chooseType(it, first){
  if (SET.mode==='flip') return 'flip';
  if (first) return it.kind==='k' ? 'k-hv' : 'v-mean';
  const allowed = qTypes(it), p = PROG[it.id]; let n = p ? p[3] + p[4] : 0;
  const cyc = it.kind==='k' ? K_CYCLE : V_CYCLE;
  for (let i = 0; i < cyc.length; i++){ const t = cyc[(n + i) % cyc.length]; if (allowed.includes(t)) return t; }
  return allowed[0];
}
function distract(it, type){
  const sameLv = ITEMS.filter(x => x.kind===it.kind && x.id!==it.id);
  if (type==='v-mean' || type==='k-hv'){
    const ans = type==='k-hv' ? it.hv+' — '+it.vn : it.vn;
    const pool = shuffle(sameLv.filter(x => Math.abs(x.lv-it.lv)<=1));
    const out = [], seen = new Set([ans]);
    for (const x of pool){ const s = type==='k-hv' ? x.hv+' — '+x.vn : x.vn; if (!seen.has(s) && (type!=='k-hv' || x.hv!==it.hv)){ seen.add(s); out.push(s); } if (out.length===3) break; }
    return {ans, opts: shuffle([ans, ...out]), jp:false};
  }
  if (type==='v-read'){
    const ans = cleanReading(readingAlts(it.r)[0]);
    const near = new Set(); kanjiOf(it.w).forEach(c => (WORDS_BY_KANJI.get(c)||[]).forEach(v => { if (v.id!==it.id) near.add(cleanReading(readingAlts(v.r)[0])); }));
    let cand = shuffle([...near]).filter(s => s!==ans);
    const L = ans.length;
    cand = cand.concat(shuffle(VOCAB.filter(v => v.id!==it.id && Math.abs(readingAlts(v.r)[0]?.length - L) <= 1).map(v => cleanReading(readingAlts(v.r)[0]))));
    const out = [...new Set(cand)].filter(s => s && s!==ans && !readingAlts(it.r).includes(s)).slice(0,3);
    return {ans, opts: shuffle([ans, ...out]), jp:true};
  }
  if (type==='v-rev'){
    const ans = it.w, cs = kanjiOf(it.w);
    let cand = []; cs.forEach(c => (WORDS_BY_KANJI.get(c)||[]).forEach(v => cand.push(v)));
    cand = shuffle(cand).concat(shuffle(VOCAB.filter(v => v.lv===it.lv && v.w.length===it.w.length)))
      .concat(VOCAB.filter(v => v.lv===it.lv).sort((a,b) => Math.abs(a.w.length-it.w.length) - Math.abs(b.w.length-it.w.length) || Math.random()-0.5));
    const out = [...new Set(cand.filter(v => v.id!==it.id && v.vn!==it.vn).map(v => v.w))].filter(w => w!==ans).slice(0,3);
    return {ans, opts: shuffle([ans, ...out]), jp:true};
  }
  if (type==='k-rev'){
    const ans = it.c;
    const pool = shuffle(sameLv.filter(x => Math.abs(x.st - it.st) <= 2 && x.hv!==it.hv)).map(x => x.c);
    const out = [...new Set(pool.concat(shuffle(sameLv).map(x=>x.c)))].filter(c => c!==ans).slice(0,3);
    return {ans, opts: shuffle([ans, ...out]), jp:true};
  }
  if (type==='k-on'){
    const ans = it.on.split('、')[0];
    const out = [...new Set(shuffle(sameLv.filter(x => x.on)).map(x => x.on.split('、')[0]))].filter(s => s!==ans && !it.on.split('、').includes(s)).slice(0,3);
    return {ans, opts: shuffle([ans, ...out]), jp:true};
  }
}

    case 'k-rev': return `<div class="vn">${esc(it.hv)} — ${esc(it.vn)}</div><div class="ask">Chữ Hán nào?</div>`;

/* ================= SESSION ENGINE ================= */
let SESSION = null;
function startSession(kind){
  const now = Date.now();
  if (kind==='review'){
    const items = dueItems().slice(0, Math.max(0, SET.maxReviews - today().r));
    if (!items.length) return toast('Chưa có thẻ nào đến hạn ôn.');
    SESSION = {kind, queue: shuffle(items.slice(0, 1000)).map(it => ({it, first:true})), total: items.length, done:0, right:0, wrong:0, seenWrong:new Set(), started:now, phase:'q'};
  } else if (kind==='new'){
    const items = newQueue(newLeft());
    if (!items.length) return toast('Hôm nay đã học đủ số từ mới. Tăng giới hạn trong Cài đặt nếu muốn học thêm.');
    SESSION = {kind, pending: items.slice(), batch:[], intro:0, queue:[], total: items.length, done:0, right:0, wrong:0, seenWrong:new Set(), started:now, phase:'intro'};
    nextBatch();
  }
  openStudy(); step();
}
function startCustom(items, title){
  if (!items.length) return toast('Không có thẻ nào.');
  SESSION = {kind:'custom', title, queue: shuffle(items.slice()).map(it => ({it, first:true})), total: items.length, done:0, right:0, wrong:0, seenWrong:new Set(), started:Date.now(), phase:'q'};
  openStudy(); step();
}
function nextBatch(){
  const S = SESSION; S.batch = S.pending.splice(0, 5); S.intro = 0;
  S.phase = S.batch.length ? 'intro' : 'done';
}
function openStudy(){ $('#study').hidden = false; document.body.style.overflow = 'hidden'; }
function closeStudy(){
  $('#study').hidden = true; document.body.style.overflow = '';
  if (SESSION){ const S = SESSION; today().t += Math.round((Date.now()-S.started)/1000); markDirty('log'); }
  SESSION = null; flush(); render();
}
function updateBar(){
  const S = SESSION; const pct = S.total ? Math.round(S.done / S.total * 100) : 0;
  $('#sBar').style.width = pct + '%';
  $('#sCount').textContent = `${S.done}/${S.total}`;
}
function step(){
  const S = SESSION; if (!S) return;
  updateBar();
  $('#sBody').scrollTop = 0;
  if (S.kind==='new' && S.phase==='intro'){
    if (S.intro < S.batch.length) return showIntro(S.batch[S.intro]);
    S.queue = shuffle(S.batch.map(it => ({it, first:true, isNew:true}))); S.phase = 'q';
  }
  if (!S.queue.length){
    if (S.kind==='new' && S.pending.length){ nextBatch(); return step(); }
    return showDone();
  }
  showQuestion(S.queue[0]);
}
function showIntro(it){
  const S = SESSION;
  $('#sMain').innerHTML = `<span class="qtag new">BÀI MỚI ${S.intro+1}/${S.batch.length}</span><div class="card">${infoHTML(it)}</div>
    <p class="small muted" style="margin:0">Đọc to cách đọc 2–3 lần, liên tưởng qua âm Hán Việt. Sau ${S.batch.length} thẻ sẽ có câu hỏi kiểm tra ngay.</p>`;
  $('#sFoot').innerHTML = `<button class="btn" id="bKnown">Đã biết rồi</button><button class="btn primary" id="bNext">Tiếp ↵</button>`;
  if (SET.audio) speak(sayText(it));
  $('#bNext').onclick = () => { S.intro++; step(); };

}
function showQuestion(q){
  const it = q.it, S = SESSION;
  const type = q.type || (q.type = chooseType(it, q.isNew && q.first));
  q.t0 = Date.now();
  const tag = q.isNew ? '<span class="qtag new">KIỂM TRA TỪ MỚI</span>' : `<span class="qtag">${it.kind==='k'?'KANJI':'TỪ VỰNG'} · N${it.lv}</span>`;

  if (type==='flip'){
    $('#sMain').innerHTML = body;

  }

  if (typing){
    body += `<input class="tin" id="tIn" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="ja" placeholder="にほんご">`;

    setTimeout(() => inp.focus(), 50);
    const go = () => { const v = inp.value.trim(); if (!v) return inp.focus(); answer(q, checkTyped(it, v), {typed:v}); };
    $('#bCheck').onclick = go; $('#bDunno').onclick = () => answer(q, false, {typed:''});
    inp.addEventListener('keydown', e => { if (e.key==='Enter' && !e.isComposing){ e.preventDefault(); go(); } });
    return;
  }
  const d = q.d || (q.d = distract(it, type));
  body += `<div class="opts">${d.opts.map((o,i) => `<button class="opt ${d.jp?'jpopt':''}" data-i="${i}"><span class="k">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  $('#sMain').innerHTML = body;
  $('#sFoot').innerHTML = `<button class="btn" id="bDunno">Không nhớ</button>`;
  $('#bDunno').onclick = () => answer(q, false, {chosen:-1});
  document.querySelectorAll('#sMain .opt').forEach(b => b.onclick = () => answer(q, d.opts[+b.dataset.i]===d.ans, {chosen:+b.dataset.i}));

function reveal(q){
  const it = q.it;
  $('#sMain').innerHTML = `<div class="card">${infoHTML(it)}</div>`;
  if (SET.audio) speak(sayText(it));
  const p = PROG[it.id];
  const est = g => { if (q.isNew || !p) return g===4?'≥4 ngày':'1 ngày'; const st = {s:p[1], d:p[2], last:p[5]*60000}; const n = fsrsNext(st, g, Date.now()); const d = g===1?1:Math.max(1, Math.round(ivlFor(n.s, SET.retention))); return d>=30 ? Math.round(d/30)+' th' : d+' ngày'; };
  $('#sFoot').innerHTML = `<div class="grade">
    <button class="btn g1" data-g="1">Quên<small>${est(1)}</small></button><button class="btn g2" data-g="2">Khó<small>${est(2)}</small></button>
    <button class="btn g3" data-g="3">Nhớ<small>${est(3)}</small></button><button class="btn g4" data-g="4">Dễ<small>${est(4)}</small></button></div>`;
  document.querySelectorAll('#sFoot [data-g]').forEach(b => b.onclick = () => commit(q, +b.dataset.g));
}
function answer(q, ok, how){
  const it = q.it, S = SESSION;
  const secs = (Date.now() - q.t0) / 1000;
  q.lastOk = ok; q.secs = secs;
  if (how.chosen !== undefined){
    document.querySelectorAll('#sMain .opt').forEach((b,i) => { b.disabled = true; if (q.d.opts[i]===q.d.ans) b.classList.add('right'); else if (i===how.chosen) b.classList.add('wrong'); });
  }
  if (how.typed !== undefined){ const inp = $('#tIn'); inp.disabled = true; inp.classList.add(ok ? 'right' : 'wrong'); }
  const verdict = ok ? `<div class="verdict ok"><span>✓ Chính xác${secs>15?' (hơi lâu)':''}</span></div>`
    : `<div class="verdict bad"><span>✗ Chưa đúng${how.typed ? ' — bạn gõ: '+esc(how.typed) : ''}</span>${how.typed!==undefined && how.typed ? '<button class="btn ghost" id="bOverride" style="min-height:34px;padding:4px 10px;font-size:13px">Tôi đúng mà</button>' : ''}</div>`;
  $('#sMain').insertAdjacentHTML('beforeend', verdict + `<div class="card">${infoHTML(it)}</div>`);
  if (SET.audio) speak(sayText(it));
  const canEasy = ok && q.first && !q.isNew;
  $('#sFoot').innerHTML = (canEasy ? `<button class="btn" id="bEasy">Quá dễ</button>` : '') + `<button class="btn primary" id="bNext">Tiếp ↵</button>`;
  const fin = g => commit(q, g);
  $('#bNext').onclick = () => fin(ok ? (secs > 15 ? 2 : 3) : 1);
  if (canEasy) $('#bEasy').onclick = () => fin(4);
  const ov = $('#bOverride'); if (ov) ov.onclick = () => { q.lastOk = true; ok = true; fin(3); };
  setTimeout(() => { const n = $('#bNext'); if (n) n.focus({preventScroll:true}); }, 30);
}
function commit(q, g){
  const it = q.it, S = SESSION, ok = g > 1;
  if (S.kind === 'test') return commitTest(q, g);
  S.queue.shift();
  const L = today();
  if (q.first){
    q.first = false;
    if (q.isNew){ L.n++; } else { L.r++; }
    if (ok) { L.ok++; S.right++; } else { S.wrong++; S.seenWrong.add(it.id); }
    if (S.kind !== 'test'){ PROG[it.id] = schedule(q.isNew ? null : PROG[it.id], q.isNew && !ok ? 1 : g, Date.now()); markDirty(docOf(it)); }
    markDirty('log');
  }
  if (ok){ S.done++; }
  else {
    // sai: hỏi lại sau 3–5 thẻ, bằng kiểu câu hỏi khác
    const pos = Math.min(S.queue.length, 3 + (Math.random()*3|0));
    S.queue.splice(pos, 0, {it, first:false, isNew:q.isNew});
  }
  step();
}

function commitTest(q, g){
  const S = SESSION;
  S.queue.shift(); if (g>1) S.right++; else { S.wrong++; S.seenWrong.add(q.it.id); } S.done++;
  if (!S.queue.length){ (LOG._tests = LOG._tests || []).push({lv:TEST.lv, n:S.total, score:Math.round(S.right/S.total*100), at:Date.now()}); LOG._tests = LOG._tests.slice(-30); markDirty('log'); return showTestDone(); }
  return step();
}
function showTestDone(){
  const S = SESSION, score = Math.round(S.right/S.total*100), wrong = [...S.seenWrong].map(id => BYID.get(id));
  updateBar();
  const verdict = score>=80 ? 'Rất tốt — đủ sức đỗ phần từ vựng.' : score>=60 ? 'Khá — ôn thêm các từ sai bên dưới.' : 'Cần ôn thêm — hãy học mới đều mỗi ngày.';
  $('#sMain').innerHTML = `<div class="res"><span class="label">Điểm thi thử N${TEST.lv}</span><div class="score">${score}%</div><div class="muted">${S.right}/${S.total} câu đúng · ${verdict}</div></div>
    ${wrong.length ? `<div class="card stack"><h2>Câu sai (${wrong.length})</h2><div class="list">${wrong.map(liHTML).join('')}</div></div>` : ''}`;
  $('#sFoot').innerHTML = (wrong.length ? `<button class="btn" id="tAdd">Đưa câu sai vào ôn</button>` : '') + `<button class="btn primary" id="bHome">Xong</button>`;
  $('#bHome').onclick = () => { closeStudy(); location.hash = '#test'; };
  const a = $('#tAdd'); if (a) a.onclick = () => {
    const nowMin = Math.floor(Date.now()/60000);
    wrong.forEach(it => { if (PROG[it.id]) PROG[it.id][0] = nowMin; else PROG[it.id] = [nowMin, W[0], initD(1), 1, 1, nowMin]; markDirty(docOf(it)); });
    a.disabled = true; a.textContent = 'Đã thêm vào Ôn tập'; };
}

/* ---- Cài đặt ---- */
let CONFIRM = null;
function renderSettings(){
  const seg = (id, arr, cur) => `<div class="seg" id="${id}">${arr.map(([v,t]) => `<button data-v="${v}" aria-pressed="${String(cur)===String(v)}">${t}</button>`).join('')}</div>`;
  const nAll = l => ITEMS.filter(it => it.lv===l && !PROG[it.id]).length;
  $('#view').innerHTML = `<div class="stack"><h1>Cài đặt</h1>
    ${window.KIOKU_SITE ? standaloneHTML().split('<!--split-->')[0] : ''}
    <div class="card set">
      <div class="it"><div><b>Từ mới mỗi ngày</b><div class="small muted">20 là vừa; 30–40 nếu sắp thi. Mỗi từ mới tạo khoảng 8–10 lượt ôn trong tháng đầu.</div></div><input type="number" id="sNew" min="0" max="200" step="5" value="${SET.newPerDay}" style="width:90px"></div>
      <div class="it"><div><b>Giới hạn ôn mỗi ngày</b></div><input type="number" id="sRev" min="20" max="2000" step="10" value="${SET.maxReviews}" style="width:90px"></div>
      <div class="it"><div><b>Kiểu trả lời</b><div class="small muted">Kết hợp: trắc nghiệm, từ lần thứ 3 chuyển sang gõ cách đọc (nhớ lâu hơn).</div></div>${seg('sMode',[['mix','Kết hợp'],['choice','Trắc nghiệm'],['type','Gõ'],['flip','Lật thẻ']],SET.mode)}</div>
      <div class="it"><div><b>Hỏi ngược</b><div class="small muted">Cho nghĩa tiếng Việt → chọn từ tiếng Nhật</div></div>${seg('sRevQ',[['1','Bật'],['0','Tắt']],SET.reverse?1:0)}</div>
      <div class="it"><div><b>Tự đọc phát âm</b></div>${seg('sAud',[['1','Bật'],['0','Tắt']],SET.audio?1:0)}</div>
      <div class="it"><div><b>Mức nhớ mục tiêu</b><div class="small muted">Cao hơn = ôn dày hơn, nhớ chắc hơn</div></div>${seg('sRet',[['0.85','85%'],['0.9','90%'],['0.95','95%']],SET.retention)}</div>
    </div>
    <div class="card set">
      <div class="it"><div><b>Cấp độ học</b></div><div class="seg" id="sLv">${[5,4,3].map(l => `<button data-v="${l}" aria-pressed="${!!SET.levels[l]}">N${l}</button>`).join('')}</div></div>
      <div class="it"><div><b>Nội dung</b></div><div class="seg" id="sKd">${[['k','Kanji'],['v','Từ vựng']].map(([k,t]) => `<button data-v="${k}" aria-pressed="${!!SET.kinds[k]}">${t}</button>`).join('')}</div></div>
      <div class="it"><div><b>Ngày thi</b></div><input type="date" id="sExam" value="${esc(SET.exam)}"></div>
      <div class="it"><div><b>Giao diện</b></div>${seg('sTheme',[['auto','Tự động'],['light','Sáng'],['dark','Tối']],SET.theme)}</div>
    </div>
    <div class="card set">
      ${[5,4].map(l => `<div class="it"><div><b>Tôi đã thuộc N${l}</b><div class="small muted">Bỏ qua ${nAll(l)} thẻ chưa học, chuyển sang ôn thưa (kiểm tra lại trong 1–2 tháng)</div></div><button class="btn" data-skip="${l}" ${nAll(l)?'':'disabled'}>Đánh dấu</button></div>`).join('')}
      <div class="it"><div><b>Xóa toàn bộ tiến độ</b><div class="small muted">Không thể hoàn tác</div></div><button class="btn" id="sReset" style="color:var(--bad)">Xóa</button></div>
      ${CONFIRM ? `<div class="confirm"><span style="flex:1 1 200px">${esc(CONFIRM.msg)}</span><button class="btn" id="cNo">Hủy</button><button class="btn" id="cYes" style="color:var(--bad)">Xác nhận</button></div>` : ''}
    </div>
    ${window.KIOKU_SITE ? standaloneHTML().split('<!--split-->')[1] : ''}
    <p class="small muted" style="margin:0">${ITEMS.filter(x=>x.kind==='k').length} kanji · ${VOCAB.length} từ vựng (N5–N3). Lịch ôn theo thuật toán FSRS-4.5. <span id="syncBadge"></span></p>
  </div>`;
  renderSyncBadge($('#syncBadge'));
  const save = () => { markDirty('settings'); };
  $('#sNew').onchange = e => { SET.newPerDay = Math.max(0, Math.min(200, +e.target.value||0)); save(); };
  $('#sRev').onchange = e => { SET.maxReviews = Math.max(20, Math.min(2000, +e.target.value||300)); save(); };
  $('#sExam').onchange = e => { SET.exam = e.target.value; save(); };
  const segH = (id, fn) => $(id).onclick = e => { const b = e.target.closest('button'); if (!b) return; fn(b.dataset.v); save(); renderSettings(); };
  segH('#sMode', v => SET.mode = v); segH('#sRevQ', v => SET.reverse = v==='1'); segH('#sAud', v => SET.audio = v==='1');
  segH('#sRet', v => SET.retention = +v); segH('#sTheme', v => { SET.theme = v; applyTheme(); });
  segH('#sLv', v => { SET.levels[v] = !SET.levels[v]; if (!Object.values(SET.levels).some(Boolean)) SET.levels[v] = true; });
  segH('#sKd', v => { SET.kinds[v] = !SET.kinds[v]; if (!Object.values(SET.kinds).some(Boolean)) SET.kinds[v] = true; });
  document.querySelectorAll('[data-skip]').forEach(b => b.onclick = () => { const l = +b.dataset.skip; CONFIRM = {msg:`Đánh dấu ${nAll(l)} thẻ N${l} là đã thuộc?`, go(){ const now = Date.now(); ITEMS.filter(it => it.lv===l && !PROG[it.id]).forEach(it => { PROG[it.id] = [Math.floor((now + (30 + Math.random()*30)*864e5)/60000), 30, 3, 1, 0, Math.floor(now/60000)]; }); markDirty('p_'+l+'k'); markDirty('p_'+l+'v'); toast(`Đã đánh dấu N${l}`); }}; renderSettings(); });
  $('#sReset').onclick = () => { CONFIRM = {msg:'Xóa toàn bộ tiến độ học trên mọi thiết bị?', go(){ PROG = {}; LOG = {}; SET.epoch = Date.now(); DOCS.forEach(d => dirty.add(d)); markDirty('settings'); markDirty('log'); toast('Đã xóa tiến độ'); }}; renderSettings(); };
  if (window.KIOKU_SITE) bindStandalone();
  if (CONFIRM){ $('#cNo').onclick = () => { CONFIRM = null; renderSettings(); }; $('#cYes').onclick = () => { const c = CONFIRM; CONFIRM = null; c.go(); renderSettings(); }; }
}

/* ================= BẢN ĐỘC LẬP (trang web riêng) ================= */
function standaloneHTML(){
  const t = window.KIOKU_SITE.topic;
  return `<div class="card stack">
    <h2>Thông báo từ vựng</h2>
    <p class="small" style="margin:0">Cài app <b>ntfy</b> (miễn phí trên App Store) → bấm <b>+</b> → nhập tên kênh dưới đây → <b>Subscribe</b>. Từ vựng sẽ tự hiện trên màn hình khóa theo lịch.</p>
    <div class="row"><code id="ntfyTopic" style="font-size:16px;padding:8px 12px;border-radius:10px;background:var(--bg);border:1px solid var(--line);user-select:all">${esc(t)}</code>
      <button class="btn" id="copyTopic">Sao chép</button></div>
    <p class="small muted" style="margin:0">${esc(window.KIOKU_SITE.schedule)}</p>
  </div><!--split-->
  <div class="card stack">
    <h2>Sao lưu tiến độ</h2>
    <p class="small muted" style="margin:0">Tiến độ lưu ngay trên máy này. Khi đổi máy hoặc muốn chuyển sang máy tính: Sao lưu ra tệp, rồi Khôi phục ở máy kia.</p>
    <div class="row"><button class="btn" id="bkSave">Sao lưu ra tệp</button><label class="btn" for="bkFile" style="display:inline-flex;align-items:center">Khôi phục từ tệp</label>
      <input type="file" id="bkFile" accept=".json,application/json" hidden></div>
  </div>`;
}
function bindStandalone(){
  $('#copyTopic').onclick = async () => { try { await navigator.clipboard.writeText(window.KIOKU_SITE.topic); toast('Đã sao chép tên kênh'); } catch(e){ const r = document.createRange(); r.selectNodeContents($('#ntfyTopic')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Đã chọn — bấm Sao chép'); } };
  $('#bkSave').onclick = () => {
    const blob = new Blob([JSON.stringify({app:'kioku', v:1, at:Date.now(), SET, PROG, LOG})], {type:'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'kioku-' + dayKey(Date.now()) + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  };
  $('#bkFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { const j = JSON.parse(await f.text()); if (j.app!=='kioku' || !j.PROG) throw 0;
      for (const id in j.PROG){ if (BYID.has(id) && (!PROG[id] || j.PROG[id][5] > PROG[id][5])) PROG[id] = j.PROG[id]; }
      for (const k in (j.LOG||{})) if (!LOG[k]) LOG[k] = j.LOG[k];
      lsSave(); toast('Đã khôi phục ' + Object.keys(j.PROG).length + ' thẻ'); render();
    } catch(err){ toast('Tệp không đúng định dạng sao lưu Kioku'); }
  };
}
